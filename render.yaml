# Deploy em um clique no Render (render.com): New → Blueprint → selecione este repositório.
services:
  - type: web
    name: gerenciador-financeiro
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gerenciador-financeiro-db
          property: connectionString

databases:
  - name: gerenciador-financeiro-db
    plan: free
