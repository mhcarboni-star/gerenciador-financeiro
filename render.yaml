# Deploy no Render (render.com): New → Blueprint → selecione este repositório.
# O banco fica no Supabase: preencha DATABASE_URL e DIRECT_URL no painel do Render
# (veja docs/banco-de-dados.md → "Configurando o Supabase").
services:
  - type: web
    name: gerenciador-financeiro
    runtime: node
    plan: free
    # mesma região do banco no Supabase (East US / North Virginia) para as telas responderem rápido
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Avisos no celular (Web Push): chaves geradas com `npx web-push generate-vapid-keys`
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://gerenciador-financeiro-p1no.onrender.com
      # Senha da tarefa de hora em hora (o mesmo valor vai no segredo JOB_SECRET do GitHub)
      - key: JOB_SECRET
        sync: false
